function getLanePoint(lane,step){ const p=steps[lane][step]; const o=laneOffsets[lane]; return {x:p.x+o.x,y:p.y+o.y}; }

const fallEnd=[{x:39,y:79,runX:12},{x:39,y:88,runX:11},{x:61,y:79,runX:88},{x:61,y:88,runX:89}];
let score=0,misses=0,selected=0,cats=[],running=false,paused=false,raf=0,lastTick=0,sound=true,speedBase=15,effectiveSpeed=15,tickMs=0;
let best=Number(localStorage.getItem('lisyusha-game-best-v26')||0); let audioCtx=null;
function bounceCatcher(lane){ const el=catchers[lane]; if(!el) return; el.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-52%) scale(1.04)'},{transform:'translate(-50%,-49%) scale(.98)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:240,easing:'ease-out'}); }
function beep(freq,dur=.06,vol=.035){if(!sound)return;try{audioCtx ||= new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}
function updateScore(){scoreEl.textContent=String(score).padStart(5,'0')} function updateMisses(){missEls.forEach((el,i)=>el.classList.toggle('used',i<misses))}
function computeEffectiveSpeed(){return Math.min(100, Math.max(0, speedBase + Math.floor(score/20)*5));}
function tickMsForPercent(p){if(p<=0) return Infinity; return Math.round(2200 - (p/100)*1850);}
function updateSpeed(){effectiveSpeed=computeEffectiveSpeed(); tickMs=tickMsForPercent(effectiveSpeed); speedReadout.textContent=effectiveSpeed+'%'; finalSpeed.textContent=effectiveSpeed+'%';}
function adjustBase(delta){speedBase=Math.max(0,Math.min(100,speedBase+delta)); updateSpeed(); beep(550,.03,.02);}
function setSelected(i){selected=i; buttons.forEach((b,n)=>b.classList.toggle('active',n===i)); catchers.forEach((g,n)=>g.classList.toggle('active',n===i)); beep(490,.03,.018)}
function makeCat(lane,step=0){const el=document.createElement('img'); el.className='kitten'; el.src=kittenSrc[lane]; el.alt='Котёнок'; const c={lane,step,el,state:'lane'}; cats.push(c); screen.appendChild(el); placeCat(c); return c}
function placeCat(c){const p=getLanePoint(c.lane,c.step); c.el.style.left=p.x+'%'; c.el.style.top=p.y+'%'; const flip=(c.lane<2?1:-1); c.el.style.transform='translate(-50%,-50%) scaleX('+flip+') rotate('+((c.step-2)*(c.lane<2?2:-2))+'deg)'}
function flash(x,y){const el=document.createElement('div'); el.className='catch-flash'; el.textContent='★'; el.style.left=x+'%'; el.style.top=y+'%'; el.style.transform='translate(-50%,-50%)'; screen.appendChild(el); setTimeout(()=>el.remove(),470)}
function laneCats(lane){return cats.filter(c=>c.state==='lane'&&c.lane===lane).sort((a,b)=>b.step-a.step)} function laneCount(lane){return cats.filter(c=>c.state==='lane'&&c.lane===lane).length} function stepOccupied(lane,step){return cats.some(c=>c.state==='lane'&&c.lane===lane&&c.step===step)}
function caught(c){score++; updateScore(); updateSpeed(); best=Math.max(best,score); localStorage.setItem('lisyusha-game-best-v26',best); const start=getLanePoint(c.lane,4), dest=catchFlashPos[c.lane]; const flip=(c.lane<2?1:-1); const dir=(c.lane<2?1:-1); const midX=(start.x+dest.x)/2 + dir*0.8; const midY=Math.min(start.y,dest.y)-4.8; c.state='caught'; beep(760,.075,.045); bounceCatcher(c.lane); c.el.classList.add('caughting'); c.el.animate([{left:start.x+'%',top:start.y+'%',opacity:1,transform:'translate(-50%,-50%) scaleX('+flip+') scale(1) rotate(0deg)'},{left:midX+'%',top:midY+'%',opacity:1,transform:'translate(-50%,-50%) scaleX('+flip+') scale(.98) rotate('+(c.lane<2?12:-12)+'deg)'},{left:dest.x+'%',top:dest.y+'%',opacity:1,transform:'translate(-50%,-50%) scaleX('+flip+') scale(.72) rotate('+(c.lane<2?20:-20)+'deg)'},{left:dest.x+'%',top:dest.y+'%',opacity:0,transform:'translate(-50%,-50%) scaleX('+flip+') scale(.20) rotate('+(c.lane<2?24:-24)+'deg)'}],{duration:360,easing:'cubic-bezier(.16,.78,.24,1)',fill:'forwards'}).onfinish=()=>{flash(dest.x,dest.y-1.0); c.el.remove(); cats=cats.filter(x=>x!==c);};}
function miss(c){misses++; updateMisses(); beep(160,.15,.05); c.state='falling'; const start=getLanePoint(c.lane,4),dest=fallEnd[c.lane]; c.el.classList.add('falling'); c.el.animate([{left:start.x+'%',top:start.y+'%',transform:'translate(-50%,-50%) scaleX('+(c.lane<2?1:-1)+') rotate(0deg)'},{left:dest.x+'%',top:dest.y+'%',transform:'translate(-50%,-50%) scaleX('+(c.lane<2?1:-1)+') rotate('+(c.lane<2?55:-55)+'deg)'}],{duration:540,easing:'cubic-bezier(.25,.7,.45,1)',fill:'forwards'}).onfinish=()=>{c.el.classList.remove('falling'); c.el.classList.add('escaping'); const runFlip=dest.runX>50?1:-1; c.el.animate([{left:dest.x+'%',top:dest.y+'%',transform:'translate(-50%,-50%) scaleX('+runFlip+') rotate(0deg)'},{left:dest.runX+'%',top:'89%',transform:'translate(-50%,-50%) scaleX('+runFlip+') rotate(0deg)'}],{duration:920,easing:'linear',fill:'forwards'}).onfinish=()=>c.el.remove()}; if(misses>=3) setTimeout(endGame,860)}
function advance(){ if(!running||paused||!Number.isFinite(tickMs)) return; const remaining=[]; for(let lane=0; lane<4; lane++){ const inLane=laneCats(lane); for(const c of inLane){ if(c.step>=4){ if(selected===lane) caught(c); else miss(c) } else { c.step+=1; placeCat(c); remaining.push(c) } } } cats=cats.filter(c=>c.state!=='lane').concat(remaining); spawnPhase(); }
function spawnPhase(){ if(effectiveSpeed<=0) return; const density=effectiveSpeed<35?1:effectiveSpeed<70?2:3; for(let tries=0; tries<density; tries++){ if(Math.random()>(0.30 + effectiveSpeed/180)) continue; const candidates=[0,1,2,3].filter(l=>laneCount(l)<5&&!stepOccupied(l,0)); if(!candidates.length) break; const lane=candidates[Math.floor(Math.random()*candidates.length)]; makeCat(lane,0) } }
function loop(ts){ if(!running) return; if(!paused && Number.isFinite(tickMs) && ts-lastTick>=tickMs){ lastTick=ts; advance() } raf=requestAnimationFrame(loop) }
function clearCats(){ cats.forEach(c=>c.el.remove()); cats=[] }
function startGame(){ cancelAnimationFrame(raf); clearCats(); score=0; misses=0; running=true; paused=false; lastTick=performance.now(); updateScore(); updateMisses(); updateSpeed(); intro.classList.add('hidden'); gameOver.classList.add('hidden'); gameBtn.classList.add('on'); setSelected(0); if(effectiveSpeed>0) spawnPhase(); raf=requestAnimationFrame(loop); root.focus(); beep(620,.08,.04)}
function endGame(){ if(!running) return; running=false; cancelAnimationFrame(raf); finalScore.textContent=score; bestScore.textContent=best; finalSpeed.textContent=effectiveSpeed+'%'; gameOver.classList.remove('hidden'); beep(110,.3,.04) }
function bindTap(el,fn){
  if(!el) return;
  let lastTouch=0;
  el.addEventListener('touchend',e=>{
    lastTouch=Date.now();
    e.preventDefault();
    fn(e);
  },{passive:false});
  el.addEventListener('click',e=>{
    if(Date.now()-lastTouch<700) return;
    fn(e);
  });
}
buttons.forEach((b,i)=>bindTap(b,()=>setSelected(i)));
bindTap(document.getElementById('startBtn'),startGame);
bindTap(document.getElementById('restartBtn'),startGame);
bindTap(speedMinus,()=>adjustBase(-5));
bindTap(speedPlus,()=>adjustBase(5));
bindTap(gameBtn,()=>{ if(!running) startGame(); else { paused=!paused; gameBtn.classList.toggle('on',!paused); beep(paused?220:520,.06,.025) } });
bindTap(soundBtn,()=>{ sound=!sound; soundBtn.classList.toggle('on',sound); if(sound) beep(700,.05,.03) });
root.addEventListener('keydown',e=>{ if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return; const k=e.key.toLowerCase(); let i=null; if(e.code==='KeyQ'||k==='й') i=0; else if(e.code==='KeyS'||k==='ы') i=1; else if(e.code==='KeyP'||k==='з') i=2; else if(e.code==='KeyL'||k==='д') i=3; else if(e.key==='ArrowLeft') i=(selected===2?0:selected===3?1:selected); else if(e.key==='ArrowRight') i=(selected===0?2:selected===1?3:selected); else if(e.key==='ArrowUp') i=(selected===1?0:selected===3?2:selected); else if(e.key==='ArrowDown') i=(selected===0?1:selected===2?3:selected); if(i!==null){e.preventDefault(); setSelected(i)} if(e.key==='-'||e.key==='_'){e.preventDefault(); adjustBase(-5)} if(e.key==='='||e.key==='+'){e.preventDefault(); adjustBase(5)} if(e.code==='Space'){e.preventDefault(); if(!running) startGame(); else {paused=!paused; gameBtn.classList.toggle('on',!paused)}} });
function mobileRefit(){ positionRamps(); }
window.addEventListener('orientationchange',()=>setTimeout(mobileRefit,180));
if(window.visualViewport) visualViewport.addEventListener('resize',mobileRefit);
positionRamps(); updateScore(); updateMisses(); updateSpeed(); setSelected(0); startGame();
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body></html>
